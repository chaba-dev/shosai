name: Auto-create Release PR

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - pubspec.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-main
  cancel-in-progress: true

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    environment: RELEASE
    steps:
      - name: Create chaba2-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip release commits
        id: skip
        run: |
          if git log -1 --pretty=%s | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for unreleased commits
        if: steps.skip.outputs.skip == 'false'
        id: changes
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          if [ -n "${latest_tag}" ]; then
            ahead="$(git rev-list --count "${latest_tag}"..HEAD)"
          else
            ahead="$(git rev-list --count HEAD)"
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"

          if [ "${ahead}" -eq 0 ]; then
            echo "No unreleased commits found"
          else
            echo "Found ${ahead} unreleased commits since ${latest_tag:-repo start}"
          fi

      - name: Compute next version
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: next-version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Skip if no version bump is needed
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: version-check
        env:
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
          NEXT_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          if [ -n "${LATEST_TAG}" ] && [ "${LATEST_TAG}" = "${NEXT_TAG}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update application version
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          version="${RELEASE_TAG#v}"
          # The pubspec version is `<semver>+<build>`; the release sets the
          # semantic version and keeps the build number.
          sed -i.bak -E "s/^version: [^+]*(\+.*)?$/version: ${version}\1/" pubspec.yaml
          rm pubspec.yaml.bak

          if ! grep -Eq "^version: ${version}(\+.*)?$" pubspec.yaml; then
            echo "Failed to update the application version in pubspec.yaml"
            exit 1
          fi

      - name: Render changelog with first-release baseline
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          export PATH="$RUNNER_TEMP/git-cliff/bin:$PATH"
          git-cliff --config cliff.toml --context --tag "$RELEASE_TAG" --output .git/release-changelog.json
          python3 scripts/generate_changelog.py .git/release-changelog.json

      - name: Create or update release branch
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        id: release-branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="release/next"
          source_commit="$(git rev-parse HEAD)"

          git fetch origin "${DEFAULT_BRANCH}"
          current_source_commit="$(git rev-parse FETCH_HEAD)"
          if [ "${source_commit}" != "${current_source_commit}" ]; then
            echo "${DEFAULT_BRANCH} advanced during this run; a newer workflow will update the release PR"
            exit 0
          fi

          bot_name='${{ steps.app-token.outputs.app-slug }}[bot]'
          bot_id="$(gh api "/users/${bot_name}" --jq .id)"
          git config user.name "${bot_name}"
          git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          trap 'rm -rf "${generated_dir}"' EXIT
          cp CHANGELOG.md pubspec.yaml "${generated_dir}/"
          git restore CHANGELOG.md pubspec.yaml

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            git fetch origin "${branch}"
            git checkout -B "${branch}" FETCH_HEAD
          else
            previous_pr="$(gh pr list \
              --base "${DEFAULT_BRANCH}" \
              --head "${branch}" \
              --state all \
              --limit 1 \
              --json number,updatedAt \
              --jq 'sort_by(.updatedAt) | last | .number // empty')"

            if [ -n "${previous_pr}" ]; then
              echo "Recovering ${branch} from pull request #${previous_pr}"
              git fetch origin "refs/pull/${previous_pr}/head"
              git checkout -b "${branch}" FETCH_HEAD
            else
              git checkout -b "${branch}" "${source_commit}"
            fi
          fi

          if ! git merge --no-edit "${source_commit}"; then
            if ! git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then
              exit 1
            fi

            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected_conflicts="$(printf '%s\n' "${conflicts}" | grep -Ev '^(CHANGELOG\.md|pubspec\.yaml)$' || true)"
            if [ -n "${unexpected_conflicts}" ]; then
              echo "Unexpected conflicts while merging ${source_commit}:"
              printf '%s\n' "${unexpected_conflicts}"
              exit 1
            fi

            git checkout "${source_commit}" -- CHANGELOG.md pubspec.yaml
            git add CHANGELOG.md pubspec.yaml
            git commit --no-edit
          fi

          cp "${generated_dir}/CHANGELOG.md" CHANGELOG.md
          cp "${generated_dir}/pubspec.yaml" pubspec.yaml
          git add CHANGELOG.md pubspec.yaml

          if git diff --cached --quiet; then
            echo "Release branch already matches generated files"
          else
            git commit -m "chore(release): ${RELEASE_TAG}"
          fi

          git push origin "${branch}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes preview
        if: steps.release-branch.outputs.commit != ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ -f "${notes}" ] && grep -q '[^[:space:]]' "${notes}"; then
            cp "${notes}" RELEASE_NOTES.md
          else
            printf 'Release notes have not been written yet. Add %s before releasing.\n' "${notes}" > RELEASE_NOTES.md
          fi

      - name: Create PR body
        if: steps.release-branch.outputs.commit != ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
          AHEAD: ${{ steps.changes.outputs.ahead }}
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
          RELEASE_COMMIT: ${{ steps.release-branch.outputs.commit }}
        run: |
          changelog="$(awk -v heading="## [${RELEASE_TAG#v}] - " '
            /^## / {
              if (found) exit
              if (index($0, heading) == 1) found = 1
            }
            found && $0 != "<!-- generated by git-cliff -->" { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md)"

          # The proposed tag does not exist yet; preview the exact PR head.
          if [ -n "${LATEST_TAG}" ]; then
            history="[Full Changelog preview (${LATEST_TAG} to proposed ${RELEASE_TAG})](https://github.com/${GITHUB_REPOSITORY}/compare/${LATEST_TAG}...${RELEASE_COMMIT})"
          else
            history="[Full history preview (initial release)](https://github.com/${GITHUB_REPOSITORY}/commits/${RELEASE_COMMIT})"
          fi
          # Canonical tag links in CHANGELOG.md become valid after tagging.
          # Do not present those not-yet-existing URLs as usable PR previews.
          changelog="$(printf '%s\n' "${changelog}" | sed '/^\[Full Changelog\](/d; /^\[Full history\](/d')"

          cat > /tmp/release-pr-body.md <<EOF
          <!-- auto-release-pr -->
          ## Release

          This PR prepares \`${RELEASE_TAG}\`.

          - Commits since last tag: ${AHEAD}
          - Source branch: \`release/next\`
          - Base branch: \`${{ github.event.repository.default_branch }}\`

          ## Notes Preview

          $(cat RELEASE_NOTES.md)

          ## Changelog (git-cliff)

          ${history}

          ${changelog}
          EOF

      - name: Find existing release PR
        if: steps.release-branch.outputs.commit != ''
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number="$(gh pr list \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        if: steps.release-branch.outputs.commit != '' && steps.existing-pr.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md

      - name: Update existing release PR
        if: steps.release-branch.outputs.commit != '' && steps.existing-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          gh pr edit "${{ steps.existing-pr.outputs.pr_number }}" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md
