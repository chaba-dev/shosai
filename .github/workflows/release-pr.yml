name: Auto-create Release PR

on:
  push:
    branches: [main]
    paths-ignore:
      - CHANGELOG.md
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pr-main
  cancel-in-progress: true

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    environment: RELEASE
    outputs:
      release_commit: ${{ steps.release-branch.outputs.commit }}
      release_tag: ${{ steps.next-version.outputs.content }}
    steps:
      - name: Create chaba2-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Skip release commits
        id: skip
        run: |
          if git log -1 --pretty=%s | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check for unreleased commits
        if: steps.skip.outputs.skip == 'false'
        id: changes
        run: |
          latest_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"

          if [ -n "${latest_tag}" ]; then
            ahead="$(git rev-list --count "${latest_tag}"..HEAD)"
          else
            ahead="$(git rev-list --count HEAD)"
          fi

          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "ahead=${ahead}" >> "$GITHUB_OUTPUT"

          if [ "${ahead}" -eq 0 ]; then
            echo "No unreleased commits found"
          else
            echo "Found ${ahead} unreleased commits since ${latest_tag:-repo start}"
          fi

      - name: Compute next version
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: next-version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Skip if no version bump is needed
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0'
        id: version-check
        env:
          LATEST_TAG: ${{ steps.changes.outputs.latest_tag }}
          NEXT_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          if [ -n "${LATEST_TAG}" ] && [ "${LATEST_TAG}" = "${NEXT_TAG}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update workspace version
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          version="${RELEASE_TAG#v}"
          sed -i.bak -E "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          rm Cargo.toml.bak

          sed -i.bak -E "/^name = \"shosai-(app|core)\"$/ { n; s/^version = \".*\"/version = \"${version}\"/; }" Cargo.lock
          rm Cargo.lock.bak

          updated="$(grep -A1 -E '^name = "shosai-(app|core)"$' Cargo.lock | grep -c "^version = \"${version}\"$")"
          if [ "${updated}" -ne 2 ]; then
            echo "Failed to update both workspace package versions in Cargo.lock"
            exit 1
          fi

      - name: Generate changelog
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.next-version.outputs.content }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes preview
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.next-version.outputs.content }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create or update release branch
        if: steps.skip.outputs.skip == 'false' && steps.changes.outputs.ahead != '0' && steps.version-check.outputs.skip == 'false'
        id: release-branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          branch="release/next"
          source_commit="$(git rev-parse HEAD)"

          git fetch origin "${DEFAULT_BRANCH}"
          current_source_commit="$(git rev-parse FETCH_HEAD)"
          if [ "${source_commit}" != "${current_source_commit}" ]; then
            echo "${DEFAULT_BRANCH} advanced during this run; a newer workflow will update the release PR"
            exit 0
          fi

          bot_name='${{ steps.app-token.outputs.app-slug }}[bot]'
          bot_id="$(gh api "/users/${bot_name}" --jq .id)"
          git config user.name "${bot_name}"
          git config user.email "${bot_id}+${bot_name}@users.noreply.github.com"

          generated_dir="$(mktemp -d)"
          trap 'rm -rf "${generated_dir}"' EXIT
          cp CHANGELOG.md Cargo.toml Cargo.lock RELEASE_NOTES.md "${generated_dir}/"
          git restore CHANGELOG.md Cargo.toml Cargo.lock
          rm RELEASE_NOTES.md

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
            git fetch origin "${branch}"
            git checkout -B "${branch}" FETCH_HEAD
          else
            previous_pr="$(gh pr list \
              --base "${DEFAULT_BRANCH}" \
              --head "${branch}" \
              --state all \
              --limit 1 \
              --json number,updatedAt \
              --jq 'sort_by(.updatedAt) | last | .number // empty')"

            if [ -n "${previous_pr}" ]; then
              echo "Recovering ${branch} from pull request #${previous_pr}"
              git fetch origin "refs/pull/${previous_pr}/head"
              git checkout -b "${branch}" FETCH_HEAD
            else
              git checkout -b "${branch}" "${source_commit}"
            fi
          fi

          if ! git merge --no-edit "${source_commit}"; then
            if ! git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then
              exit 1
            fi

            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected_conflicts="$(printf '%s\n' "${conflicts}" | grep -Ev '^(CHANGELOG\.md|Cargo\.toml|Cargo\.lock)$' || true)"
            if [ -n "${unexpected_conflicts}" ]; then
              echo "Unexpected conflicts while merging ${source_commit}:"
              printf '%s\n' "${unexpected_conflicts}"
              exit 1
            fi

            git checkout "${source_commit}" -- CHANGELOG.md Cargo.toml Cargo.lock
            git add CHANGELOG.md Cargo.toml Cargo.lock
            git commit --no-edit
          fi

          cp "${generated_dir}"/* .
          git add CHANGELOG.md Cargo.toml Cargo.lock

          if git diff --cached --quiet; then
            echo "Release branch already matches generated files"
          else
            git commit -m "chore(release): ${RELEASE_TAG}"
          fi

          git push origin "${branch}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark release build as pending
        if: steps.release-branch.outputs.commit != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_COMMIT: ${{ steps.release-branch.outputs.commit }}
        run: |
          gh api \
            --method POST \
            "repos/${{ github.repository }}/statuses/${RELEASE_COMMIT}" \
            -f state=pending \
            -f context='Release build dry run' \
            -f description='Building installable release packages'

      - name: Create PR body
        if: steps.release-branch.outputs.commit != ''
        env:
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
          AHEAD: ${{ steps.changes.outputs.ahead }}
        run: |
          cat > /tmp/release-pr-body.md <<EOF
          <!-- auto-release-pr -->
          ## Release

          This PR prepares \`${RELEASE_TAG}\`.

          - Commits since last tag: ${AHEAD}
          - Source branch: \`release/next\`
          - Base branch: \`${{ github.event.repository.default_branch }}\`

          ## Notes Preview

          $(cat RELEASE_NOTES.md)
          EOF

      - name: Find existing release PR
        if: steps.release-branch.outputs.commit != ''
        id: existing-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr_number="$(gh pr list \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        if: steps.release-branch.outputs.commit != '' && steps.existing-pr.outputs.pr_number == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "release/next" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md

      - name: Update existing release PR
        if: steps.release-branch.outputs.commit != '' && steps.existing-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.next-version.outputs.content }}
        run: |
          gh pr edit "${{ steps.existing-pr.outputs.pr_number }}" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body-file /tmp/release-pr-body.md

  dry-run-release:
    name: Dry-run release packages
    needs: create-release-pr
    if: needs.create-release-pr.outputs.release_commit != ''
    permissions:
      contents: read
    uses: ./.github/workflows/publish-release.yml
    with:
      release_tag: ${{ needs.create-release-pr.outputs.release_tag }}
      checkout_ref: ${{ needs.create-release-pr.outputs.release_commit }}
      publish: false

  report-dry-run:
    name: Report release build result
    needs: [create-release-pr, dry-run-release]
    if: always() && needs.create-release-pr.outputs.release_commit != ''
    runs-on: ubuntu-latest
    environment: RELEASE
    steps:
      - name: Create chaba2-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-statuses: write

      - name: Update release commit status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_COMMIT: ${{ needs.create-release-pr.outputs.release_commit }}
          BUILD_RESULT: ${{ needs.dry-run-release.result }}
        run: |
          if [ "${BUILD_RESULT}" = success ]; then
            state=success
            description='All installable release packages built successfully'
          else
            state=failure
            description='One or more release packages failed to build'
          fi

          gh api \
            --method POST \
            "repos/${{ github.repository }}/statuses/${RELEASE_COMMIT}" \
            -f state="${state}" \
            -f context='Release build dry run' \
            -f description="${description}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
