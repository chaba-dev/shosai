name: Build and Publish Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Validated v-prefixed release tag
        required: true
        type: string
      checkout_ref:
        description: Tagged commit or merge commit to build
        required: true
        type: string
      publish:
        description: Create or update the GitHub release after building
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64
            pdfium_asset: pdfium-linux-x64.tgz
            pdfium_sha256: c3af580f9df0fef9545b44115bc5ea440f286956b5f231df69fb373b8efc4f69
            package_script: scripts/package-linux.sh
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-aarch64
            pdfium_asset: pdfium-linux-arm64.tgz
            pdfium_sha256: a19862a36e2b2da3c3fb43f0deef45fbbc331f58cd47943782ae4bd9db4c66d9
            package_script: scripts/package-linux.sh
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: macos-x86_64
            pdfium_asset: pdfium-mac-x64.tgz
            pdfium_sha256: 4b924d948d2ec4863435d375a94541b4003c59f8adc28cc5e4236b0ab81a355d
            package_script: scripts/package-macos.sh
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact_name: macos-aarch64
            pdfium_asset: pdfium-mac-arm64.tgz
            pdfium_sha256: e214ee33f22b2204daa765a545aee1e425d88448e6154dac95c6a06206b7437f
            package_script: scripts/package-macos.sh
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libssl-dev libvulkan-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxcursor-dev \
            libxi-dev libxrandr-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ runner.os == 'macOS' && '12.0' || '' }}
        run: cargo build --release --locked --target "${{ matrix.target }}" --bin shosai

      - name: Download pinned PDFium
        env:
          PDFIUM_ASSET: ${{ matrix.pdfium_asset }}
          PDFIUM_SHA256: ${{ matrix.pdfium_sha256 }}
        run: |
          curl -fsSL \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/7999/${PDFIUM_ASSET}" \
            -o pdfium.tgz
          printf '%s  %s\n' "${PDFIUM_SHA256}" pdfium.tgz | shasum -a 256 -c -
          mkdir pdfium
          tar -xzf pdfium.tgz -C pdfium

      - name: Package Linux application
        if: runner.os == 'Linux'
        env:
          OUTPUT_DIR: dist
        run: |
          bash "${{ matrix.package_script }}" \
            "${{ inputs.release_tag }}" \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/shosai" \
            pdfium

      - name: Package macOS application
        if: runner.os == 'macOS'
        env:
          OUTPUT_DIR: dist
        run: |
          architecture="${{ matrix.target }}"
          architecture="${architecture%%-*}"
          bash "${{ matrix.package_script }}" \
            "${{ inputs.release_tag }}" \
            "${architecture}" \
            "target/${{ matrix.target }}/release/shosai" \
            pdfium

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment: RELEASE
    steps:
      - name: Create chaba2-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate tag matches workspace version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

          if [ -z "${workspace_version}" ] || [ "${tag_version}" != "${workspace_version}" ]; then
            echo "Tag ${RELEASE_TAG} does not match Cargo.toml workspace version ${workspace_version}"
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS

      - name: Generate release notes
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ inputs.release_tag }}
          body: ${{ steps.release-notes.outputs.content }}
          files: dist/*
          fail_on_unmatched_files: true
          overwrite_files: true
