name: Refresh Gutenberg catalog

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: RELEASE
    steps:
      - name: Create chaba2-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Download and regenerate offline metadata
        run: |
          mkdir "$RUNNER_TEMP/catalog-refresh"
          nix develop --command curl --fail --location --retry 3 --max-time 300 \
            --user-agent 'Shosai-catalog-refresh (+https://github.com/chaba-dev/shosai)' \
            https://mirror.cs.odu.edu/gutenberg-epub/feeds/pg_catalog.csv.gz \
            --output "$RUNNER_TEMP/catalog-refresh/feed.csv.gz"
          cd packages/shosai_core
          nix develop ../.. --command dart pub get
          nix develop ../.. --command dart run tool/import_gutenberg.dart \
            "$RUNNER_TEMP/catalog-refresh/feed.csv.gz" "$RUNNER_TEMP/catalog-refresh/catalog.sqlite"
          nix develop ../.. --command dart run tool/export_catalog_json.dart \
            "$RUNNER_TEMP/catalog-refresh/catalog.sqlite" "$RUNNER_TEMP/catalog-refresh/snapshot" \
            --previous ../../website/static/catalog/current

      - name: Validate and propose changed content
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          bot_name="${BOT_SLUG}[bot]"
          bot_id="$(nix develop --command gh api "/users/${bot_name}" --jq .id)"
          export GIT_AUTHOR_NAME="$bot_name" GIT_COMMITTER_NAME="$bot_name"
          export GIT_AUTHOR_EMAIL="${bot_id}+${bot_name}@users.noreply.github.com"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          nix develop --command python3 website/refresh_catalog.py "$RUNNER_TEMP/catalog-refresh/snapshot"
