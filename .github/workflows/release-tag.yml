name: Auto-tag Release Commits

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: release-tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  tag-release:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release/next' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: RELEASE
    outputs:
      release_tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create chaba2-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine release tag
        id: release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          git fetch --tags origin

          if ! printf '%s\n' "${PR_TITLE}" | grep -Eq '^chore\(release\): v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release PR title is not valid: ${PR_TITLE}"
            exit 1
          fi

          tag_name="$(printf '%s\n' "${PR_TITLE}" | sed -E 's/^chore\(release\): (v[0-9]+\.[0-9]+\.[0-9]+)$/\1/')"
          workspace_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"

          if [ "${tag_name#v}" != "${workspace_version}" ]; then
            echo "Release tag ${tag_name} does not match Cargo.toml workspace version ${workspace_version}"
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/${tag_name}"; then
            actual="$(git rev-parse "refs/tags/${tag_name}^{commit}")"
            expected="$(git rev-parse HEAD)"
            if [ "${actual}" != "${expected}" ]; then
              echo "Tag ${tag_name} points to ${actual}, expected ${expected}"
              exit 1
            fi

            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.release.outputs.skip == 'false'
        run: |
          git tag "${{ steps.release.outputs.tag_name }}"
          git push origin "${{ steps.release.outputs.tag_name }}"

  # Publish directly after tagging so the automatic release remains one
  # observable, retryable workflow. release.yml handles manually pushed tags.
  publish-release:
    needs: tag-release
    uses: ./.github/workflows/publish-release.yml
    secrets: inherit
    with:
      release_tag: ${{ needs.tag-release.outputs.release_tag }}
      checkout_ref: ${{ github.event.pull_request.merge_commit_sha }}
