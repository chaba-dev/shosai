name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/website.yml"
      - ".github/workflows/catalog-refresh.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/website.yml"
      - ".github/workflows/catalog-refresh.yml"

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command python3 -m unittest discover -s website -p 'test_catalog*.py'
      - run: nix develop --command bash website/build.sh
