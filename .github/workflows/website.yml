name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/website.yml"

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command hugo --source website --minify
