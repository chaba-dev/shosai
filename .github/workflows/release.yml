name: GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    uses: ./.github/workflows/publish-release.yml
    secrets: inherit
    with:
      release_tag: ${{ github.ref_name }}
      checkout_ref: ${{ github.ref }}
