name: Build and upload to Play internal testing

on:
  workflow_call:

jobs:
  build:
    if: github.repository == 'chaba-dev/shosai' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: RELEASE
    permissions:
      contents: read
      id-token: write
    outputs:
      version_code: ${{ steps.version.outputs.code }}
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - id: version
        name: Allocate the Play version code
        run: |
          code=$((10000 + GITHUB_RUN_NUMBER))
          (( code <= 2100000000 ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # The pinned Nix shell needs Git history.
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - run: .agents/dev flutter pub get --enforce-lockfile
      - name: Authenticate to release Secret Manager
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.SHOSAI_SECRETS_PROJECT }}
          workload_identity_provider: ${{ vars.SHOSAI_RELEASE_WORKLOAD_IDENTITY_PROVIDER }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Build signed Android bundle
        env:
          SHOSAI_SECRETS_PROJECT: ${{ vars.SHOSAI_SECRETS_PROJECT }}
          SHOSAI_BUILD_SECRET_VERSION: '1'
          SHOSAI_ANDROID_BUILD_NUMBER: ${{ steps.version.outputs.code }}
          SHOSAI_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHOSAI_ANDROID_KEYSTORE_BASE64 }}
          SHOSAI_ANDROID_STORE_PASSWORD: ${{ secrets.SHOSAI_ANDROID_STORE_PASSWORD }}
          SHOSAI_ANDROID_KEY_ALIAS: ${{ secrets.SHOSAI_ANDROID_KEY_ALIAS }}
          SHOSAI_ANDROID_KEY_PASSWORD: ${{ secrets.SHOSAI_ANDROID_KEY_PASSWORD }}
        run: |
          : "${SHOSAI_ANDROID_KEYSTORE_BASE64:?Missing RELEASE upload keystore}"
          umask 077
          SHOSAI_ANDROID_KEYSTORE="$(mktemp "$RUNNER_TEMP/shosai-upload.XXXXXXXX")"
          export SHOSAI_ANDROID_KEYSTORE
          trap 'rm -f -- "$SHOSAI_ANDROID_KEYSTORE"' EXIT
          printf '%s' "$SHOSAI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SHOSAI_ANDROID_KEYSTORE"
          unset SHOSAI_ANDROID_KEYSTORE_BASE64
          .agents/dev ./scripts/with-build-secrets.sh release 'make android-production'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: bundle
        with:
          name: shosai-play-${{ steps.version.outputs.code }}-attempt-${{ github.run_attempt }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Upload to Play internal (version ${{ needs.build.outputs.version_code }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: PLAY_INTERNAL
    concurrency:
      group: shosai-play-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: play-bundle
          merge-multiple: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: play
        with:
          workload_identity_provider: projects/394614696557/locations/global/workloadIdentityPools/shosai-play-internal/providers/github
          service_account: shosai-play-internal@shosai-512821.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload the approved bundle
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play.outputs.access_token }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: bash scripts/play-publish.sh internal "$VERSION_CODE" play-bundle/app-release.aab
