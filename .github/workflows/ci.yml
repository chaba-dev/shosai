name: CI

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - "fixtures/**"
      - "assets/**"
      - "rfd/**"
      - "scripts/**"
      - "benchmarks/**"
      - "docs/design-system/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-pr.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter/**"
      - "fixtures/**"
      - "assets/**"
      - "rfd/**"
      - "scripts/**"
      - "benchmarks/**"
      - "docs/design-system/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-pr.yml"

jobs:
  dart-format:
    name: Dart format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make check-fmt

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make lint

  rfd-validation:
    name: RFD validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-rfds

  generated-sources:
    name: Generated sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make check-l10n-codegen
      - run: nix develop .#ci --command make check-theme-tokens

  flutter-test:
    name: Flutter tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make test-app

  script-test:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make test-scripts

  flutter-linux-host:
    name: Flutter Linux host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make linux-debug
      - name: Verify the Linux bundle carries the declared fonts
        run: nix develop .#ci --command make check-linux-bundle

  flutter-packaged-linux:
    name: Flutter packaged tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      # Unsets the PDFium overrides: the bundle's PDFium and SQLite must load.
      - run: nix develop .#ci --command make test-packaged-linux

  flutter-packaged-macos:
    name: Flutter packaged tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make test-packaged-macos

  flutter-macos-host:
    name: Flutter macOS host
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop .#ci --command make macos-smoke
      - name: Verify the macOS bundle carries the declared fonts
        run: |
          nix develop .#ci --command python3 scripts/check_flutter_bundle.py \
            "flutter/build/macos/Build/Products/Debug/shosai_flutter.app"
