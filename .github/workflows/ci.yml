name: CI

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
      - "fixtures/**"
      - "assets/**"
      - "rfd/**"
      - "scripts/**"
      - "benchmarks/**"
      - "docs/design-system/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-pr.yml"
  pull_request:
    branches: [main]
    paths:
      - "flutter/**"
      - "fixtures/**"
      - "assets/**"
      - "rfd/**"
      - "scripts/**"
      - "benchmarks/**"
      - "docs/design-system/**"
      - "Makefile"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-pr.yml"

jobs:
  dart-format:
    name: Dart format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make check-fmt-flutter

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make lint-flutter

  rfd-validation:
    name: RFD validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-rfds

  generated-sources:
    name: Generated sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make check-l10n-codegen
      - run: nix develop --command make check-theme-tokens

  flutter-test:
    name: Flutter tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make test-flutter

  script-test:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make test-scripts

  flutter-linux-host:
    name: Flutter Linux host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make flutter-linux-debug
      - name: Verify the Linux bundle carries the declared fonts
        run: nix develop --command make flutter-bundle-check-linux

  flutter-macos-host:
    name: Flutter macOS host
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command make flutter-macos-smoke
      - name: Verify the macOS bundle carries the declared fonts
        run: |
          nix develop --command python3 scripts/check_flutter_bundle.py \
            "flutter/build/macos/Build/Products/Debug/shosai_flutter.app"
