name: shosai_core
description: >-
  Dart application core for the Shōsai reader: the SQLite store and the
  library, reading-state, bookmark, annotation and search records over it.
  Replaces the Rust core (RFD 4, milestone M3.0).
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.3

dependencies:
  crypto: ^3.0.6
  image: ^4.12.0
  path: ^1.9.1
  shosai_epub:
    path: ../shosai_epub
  # Bundles SQLite through its build hook (no system library); see the
  # package README for the pinned binary and the hosts it was proven on.
  sqlite3: 3.5.2
  # Exact: shosai-quote-v1 pins Unicode 17.0.0 NFC, which 0.3.2 carries (0.3.3
  # moved to Unicode 18). test/unicode_test.dart fails on a version change.
  unorm_dart: 0.3.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
