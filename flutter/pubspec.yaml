name: shosai_flutter
description: "Cross-platform frontend for Shōsai."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  characters: ^1.4.1
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.11.1
  path_provider: ^2.1.5
  shadcn_ui: ^0.56.3
  shosai_epub:
    path: packages/shosai_epub
  shosai_flutter_bridge:
    path: rust_builder

dev_dependencies:
  # Reader tests build small in-memory EPUB archives (nested tables of
  # contents, fragment targets, painted links) instead of extending the shared
  # conformance corpus; the engine already depends on `archive`.
  archive: ^4.3.0
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # The opt-in real-book corpus pass reads Dart retained heap through the VM
  # service (`getAllocationProfile`); the version is pinned by pubspec.lock.
  vm_service: ^15.3.0

flutter:
  uses-material-design: true
  # Enables gen-l10n (see l10n.yaml). In this toolchain the flag is still
  # required even though the synthetic-package mode is gone, so the generated
  # AppLocalizations sources are written into lib/l10n and committed.
  generate: true
  fonts:
    # The faces' source of truth is the repository's `assets/fonts/` (used by
    # the Rust app, the website and the packaging licenses); the `flutter/fonts`
    # symlinks keep those files *inside* this project so the bundler places
    # them in `flutter_assets/fonts/`. A path that escapes the project
    # (`../assets/fonts/...`) is recorded in the manifests but never copied
    # into a built bundle: `rootBundle.load` then fails, the bundled EPUB
    # font-coverage gate reads null and every chapter stays on the retained
    # renderer (2026-10-02 corpus pass, finding 1). A checkout that does not
    # support symlinks (e.g. Windows with symlink creation disabled) must not
    # be used to build or develop the Flutter host: the bundler would package
    # the link's target path as the font's bytes. No Windows Flutter host
    # exists today; keep it that way until a symlinked checkout is guaranteed.
    - family: Inter
      fonts:
        - asset: fonts/InterVariable.ttf
    - family: Noto Sans JP
      fonts:
        - asset: fonts/NotoSansJP-Variable.ttf
  # Both faces' licenses require the copyright notice and license text to
  # accompany redistribution; Flutter collects `licenses:` entries into the
  # bundle's NOTICES.Z (`fonts/` is also where the symlinked license files
  # live, and the bundle check verifies the notices carry both texts).
  licenses:
    - fonts/LICENSE-Inter
    - fonts/LICENSE-NotoSansJP.txt
