name: shosai_flutter
description: "Cross-platform frontend for Shōsai."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  file_selector: ^1.0.3
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.11.1
  path_provider: ^2.1.5
  shadcn_ui: ^0.56.3
  shosai_flutter_bridge:
    path: rust_builder

dev_dependencies:
  ffigen: ^20.1.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Enables gen-l10n (see l10n.yaml). In this toolchain the flag is still
  # required even though the synthetic-package mode is gone, so the generated
  # AppLocalizations sources are written into lib/l10n and committed.
  generate: true
  fonts:
    - family: Inter
      fonts:
        - asset: ../assets/fonts/InterVariable.ttf
    - family: Noto Sans JP
      fonts:
        - asset: ../assets/fonts/NotoSansJP-Variable.ttf
