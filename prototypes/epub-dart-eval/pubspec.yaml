name: shosai_epub_eval
description: >-
  Phase C evaluation prototype: a Dart-owned EPUB parser/normalizer rendered by
  Flutter layout. Evaluation only; not a production engine or an architecture
  decision. See README.md.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shosai_epub:
    path: packages/shosai_epub

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # The prototype loads Inter and Noto Sans JP from the repository's
  # assets/fonts at runtime (see lib/reader/script_fonts.dart) instead of
  # bundling 10 MB of duplicated binaries in this evaluation directory.
