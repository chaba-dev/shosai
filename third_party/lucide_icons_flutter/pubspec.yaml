name: lucide_icons_flutter
description: Lucide icons for Flutter (standard font only).
version: 3.1.19
publish_to: none
homepage: https://lucide.dev
repository: https://github.com/vqh2602/lucide-flutter-main

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Lucide
      fonts:
        - asset: assets/lucide.ttf
