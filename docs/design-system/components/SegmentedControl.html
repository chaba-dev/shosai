<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SegmentedControl · Shōsai design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
body { margin: 0; background: var(--canvas); }
.demo { padding: 20px 24px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
</style>
</head>
<body>
<div class="sh demo">
  <div class="sh-seg" role="group" aria-label="Scope"><button aria-pressed="true">This book</button><button aria-pressed="false">All books</button></div>
  <div class="sh-seg" role="group" aria-label="Pages"><button aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2"/></svg>One page</button><button aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>Two pages</button></div>
  <div class="sh-seg" role="group" aria-label="Show"><button aria-pressed="true">Everything</button><button aria-pressed="false">Text</button><button aria-pressed="false">Notes</button></div>
</div>
</body>
</html>
