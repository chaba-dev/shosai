<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DisplaySettings · Shōsai design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
body { margin: 0; background: var(--canvas); }
.demo { padding: 20px 24px; display: flex; gap: 32px; align-items: flex-start; background: var(--surface-sunken); min-height: 450px; box-sizing: border-box; }
.col { display: flex; flex-direction: column; gap: 8px; }
.cap { font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.sh-seg { align-self: flex-start; }
</style>
</head>
<body>
<div class="sh demo">
  <div class="col"><span class="cap">EPUB</span><div class="sh-popover" role="dialog" aria-label="Display settings">
    <div class="sh-field"><span class="sh-field__label">Page theme</span><div class="sh-themes"><button class="sh-theme sh-theme--paper" aria-pressed="true"><b>Aa</b>Paper</button><button class="sh-theme sh-theme--sepia" aria-pressed="false"><b>Aa</b>Sepia</button><button class="sh-theme sh-theme--night" aria-pressed="false"><b>Aa</b>Night</button></div></div>
    <div class="sh-field"><span class="sh-field__label">Text size</span><div class="sh-stepper"><button class="sh-btn sh-btn--icon sh-btn--secondary" aria-label="Smaller"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><output>100%</output><button class="sh-btn sh-btn--icon sh-btn--secondary" aria-label="Larger"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div><span class="sh-field__hint">Pages reflow; your place is kept.</span></div>
    <div class="sh-field"><span class="sh-field__label">Pages</span><div class="sh-seg" role="group" aria-label="Pages"><button aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2"/></svg>One</button><button aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>Two</button></div></div>
    <div class="sh-field"><span class="sh-field__label">Font</span><div class="sh-seg" role="group" aria-label="Font"><button aria-pressed="true">Book’s own</button><button aria-pressed="false">Serif</button><button aria-pressed="false">Sans</button></div></div>
  </div></div>
  <div class="col"><span class="cap">PDF</span><div class="sh-popover" role="dialog" aria-label="Display settings">
    <div class="sh-field"><span class="sh-field__label">Page theme</span><div class="sh-themes"><button class="sh-theme sh-theme--paper" aria-pressed="true"><b>Aa</b>Paper</button><button class="sh-theme sh-theme--sepia" aria-pressed="false"><b>Aa</b>Sepia</button><button class="sh-theme sh-theme--night" aria-pressed="false"><b>Aa</b>Night</button></div></div>
    <div class="sh-field"><span class="sh-field__label">Zoom</span><div class="sh-stepper"><button class="sh-btn sh-btn--icon sh-btn--secondary" aria-label="Smaller"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><output>Fit width</output><button class="sh-btn sh-btn--icon sh-btn--secondary" aria-label="Larger"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div><span class="sh-field__hint">Pages re-render at each zoom, so text stays sharp.</span></div>
    <div class="sh-field"><span class="sh-field__label">Pages</span><div class="sh-seg" role="group" aria-label="Pages"><button aria-pressed="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="12" height="20" x="6" y="2" rx="2"/></svg>One</button><button aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>Two</button></div></div>
    
  </div></div>
</div>
</body>
</html>
