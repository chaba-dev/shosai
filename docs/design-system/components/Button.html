<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button · Shōsai design system</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
body { margin: 0; background: var(--canvas); }
.demo { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.label { margin-left: 8px; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
</style>
</head>
<body>
<div class="sh demo">
  <div class="row">
    <button class="sh-btn sh-btn--primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Go to</button>
    <button class="sh-btn sh-btn--secondary">Cancel</button>
    <button class="sh-btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Page note</button>
    <button class="sh-btn sh-btn--selected"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M13 8H7"/><path d="M17 12H7"/></svg>Notes<span class="sh-count">12</span></button>
    <button class="sh-btn"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M13 8H7"/><path d="M17 12H7"/></svg>Notes<span class="sh-count">12</span></button>
    <button class="sh-btn sh-btn--danger">Delete note</button>
    <button class="sh-btn sh-btn--secondary" disabled>Export</button>
  </div>
  <div class="row">
    <button class="sh-btn sh-btn--icon" aria-label="Contents"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg></button>
    <button class="sh-btn sh-btn--icon" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="sh-btn sh-btn--icon" aria-label="Bookmark this page"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button>
    <button class="sh-btn sh-btn--icon sh-btn--selected" aria-label="Two pages" aria-pressed="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg></button>
    <span class="label">32 px desktop</span>
  </div>
  <div class="row">
    <button class="sh-btn sh-btn--icon sh-btn--touch" aria-label="Contents"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></svg></button>
    <button class="sh-btn sh-btn--icon sh-btn--touch" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
    <button class="sh-btn sh-btn--touch sh-btn--primary"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>Go to</button>
    <span class="label">44 px touch</span>
  </div>
</div>
</body>
</html>
