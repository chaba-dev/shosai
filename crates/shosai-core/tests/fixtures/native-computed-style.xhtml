<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml">
  <body id="body">
    <article id="chapter" dir="rtl">
      <h1 id="title">Native computed style</h1>
      <p id="lead" class="note" style="font-style: italic; margin-left: 25%">
        <span id="mixed">English العربية 日本語</span>
      </p>
      <p id="source-order" class="source-order">Source order</p>
      <p id="hidden" class="hidden">Hidden</p>
      <code id="code">code default</code>
      <div id="margin-percent" class="margin-percent">percentage margin</div>
      <div id="display-contents" class="display-contents">display contents</div>
      <div id="light-weight" class="light-weight">
        <span id="bolder-weight" class="bolder-weight">bolder</span>
      </div>
      <div id="heavy-weight" class="heavy-weight">
        <span id="lighter-weight" class="lighter-weight">lighter</span>
      </div>
      <section id="match-parent-parent" class="match-parent-parent">
        <span id="match-parent-child" class="match-parent-child">match parent</span>
      </section>
      <p id="layer-target">layer target</p>
      <div id="rem-length" class="rem-length">rem</div>
      <div id="px-length" class="px-length">px</div>
      <div id="pt-length" class="pt-length">pt</div>
      <table id="table">
        <caption id="caption">Fixture table</caption>
        <tbody id="body-rows">
          <tr id="row">
            <th id="heading">Heading</th>
            <td id="cell" class="emphasis">Cell</td>
          </tr>
        </tbody>
      </table>
      <math id="equation" xmlns="http://www.w3.org/1998/Math/MathML">
        <mfrac><mi>a</mi><mi>b</mi></mfrac>
      </math>
    </article>
    <section id="css-direction" class="css-direction">
      <span id="css-direction-child">CSS direction</span>
    </section>
  </body>
</html>
