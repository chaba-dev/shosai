[package]
name = "shosai-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shosai"
path = "src/main.rs"

[[example]]
name = "epub-wry-spike"
required-features = ["epub-wry-spike"]

[features]
epub-wry-spike = ["dep:gtk", "dep:winit", "dep:wry", "dep:x11-dl"]

[dependencies]
shosai-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
iced = { version = "0.14", features = ["advanced", "image", "svg", "tokio"] }
rfd = "0.15"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
open = "5.3.3"
fluent-templates = "0.15.1"
sys-locale = "0.3.2"
unic-langid = { version = "0.9", features = ["macros"] }
cosmic-text = "=0.15.0"
wry = { version = "0.56.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18.2", optional = true }
winit = { version = "0.30.13", optional = true }
x11-dl = { version = "2.21.0", optional = true }

[dev-dependencies]
iced_runtime = "0.14.0"
iced_tiny_skia = "0.14.0"
roxmltree = "0.21.1"
taffy = { version = "=0.13.0", default-features = false, features = ["std", "alloc", "taffy_tree", "block_layout", "grid"] }
tempfile = "3.27.0"
ttf-parser = "=0.25.1"
zip = { version = "8.4.0", default-features = false }
