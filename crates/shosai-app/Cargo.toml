[package]
name = "shosai-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "shosai"
path = "src/main.rs"

[[example]]
name = "epub-wry-spike"
required-features = ["epub-wry-spike"]

[features]
epub-wry-spike = ["dep:wry"]

[dependencies]
shosai-core.workspace = true
anyhow.workspace = true
bytes.workspace = true
iced = { version = "0.14", features = ["advanced", "image", "tokio"] }
rfd = "0.15"
tokio = { version = "1", features = ["fs", "macros", "rt", "sync", "time"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif"] }
open = "5.3.3"
wry = { version = "0.56.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3.27.0"
